[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-engine"
version = "0.1.0"
description = "1-day 99% VaR and Expected Shortfall for an equal-weight ETF/equity portfolio, with backtests and GARCH vs gradient-boosting volatility forecasts."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "arch",
    "scikit-learn",
    "lightgbm",
    "yfinance",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
